name: Deploy to cPanel via FTP

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: "cpanel-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site for production (landtsolutions.com)
        run: npm run build
        env:
          GITHUB_PAGES: 'false'

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync files to cPanel via FTPS (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
        run: |
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:max-retries 5
          set net:timeout 30
          mirror -R --verbose --parallel=1 ./dist/ "$FTP_SERVER_DIR"
          bye
          EOF
